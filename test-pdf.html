<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Harness PDF Import</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head><body>
<div id="botonesChequera"></div>
<div id="botonesCUP"></div>
<div id="botonesUSD"></div>
<div id="log"></div>
<script>
/* Stubs mínimos de la app Finanzas FRANWE */
let movimientos = [];
let nextId = 1;
let modoEdicionActivo = false;
let edicionMesNombre = '';
const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function getFechaStr(m, a){ return MESES_ES[m-1] + ' ' + a; }
function getHistorial(){ return window.__historial || []; }
function puedeEditar(){ return true; }
function mesEstaBloqueado(){ return false; }
function isAdmin(){ return true; }
function periodoNominaActual(){ return 'Octubre 2026'; }
function hoy(){ return '2026-10-04'; }
function tasaVista(){ return 1; }
function saveMovimientos(m){ window.__savedMovs = m; }
function saveHistorial(h){ window.__savedHist = h; }
function renderAll(){ window.__rendered = true; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
window.addEventListener('error', e=>{ document.getElementById('log').textContent += 'ERROR: '+e.message+'\n'; });
window.addEventListener('unhandledrejection', e=>{ document.getElementById('log').textContent += 'UNHANDLED: '+(e.reason&&e.reason.message||e.reason)+'\n'; });
</script>
<script src="pdf-import.js"></script>
</body></html>
